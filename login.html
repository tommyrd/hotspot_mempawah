<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Qomar Hotspot | Gunakan Internet Untuk Hal Positip</title>
  <meta name="description" content="Portal Login Hotspot MikroTik Yayasan Al-Qomar Kuala Secapah Mempawah — Gunakan Internet Untuk Hal Positip (Internetan Sambil Beramal)." />
  <meta property="og:title" content="Al-Qomar Hotspot" />
  <meta property="og:description" content="Portal Login Hotspot MikroTik Yayasan Al-Qomar — Terhubung dengan Kebaikan." />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="alqomar.css" type="text/css" />
</head>
<body>
$(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
  </form>
  <script type="text/javascript" src="/md5.js"></script>
  <script type="text/javascript">
  <!--
    function doLogin() {
      document.login.password.value = document.login.username.value;
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  //-->
  </script>
$(endif)

  <div class="alq-stage">
    <main class="alq-portal">
      <!-- Top Ornamental Arch, Hanging Lanterns & Yayasan Al-Qomar Logo -->
      <header class="alq-hero">
        <img
          src="img/top-arch.jpg"
          alt=""
          aria-hidden="true"
          class="alq-top-arch"
        />
        <div class="alq-logo-wrap">
          <img
            src="img/logo-alqomar.png"
            alt="Logo Yayasan Al-Qomar Kuala Secapah Mempawah"
            class="alq-logo"
          />
        </div>
      </header>

      <!-- Middle Title, Slogan Plaque & MikroTik Login Form -->
      <section class="alq-body">
        <div class="alq-side-art alq-side-left" aria-hidden="true"></div>
        <div class="alq-side-art alq-side-right" aria-hidden="true"></div>

        <div class="alq-content">
          <h1 class="alq-title">Al-Qomar Hotspot</h1>

          <!-- Golden Divider with Mosque Silhouette -->
          <div class="alq-divider" aria-hidden="true">
            <span class="alq-divider-line"></span>
            <svg class="alq-mosque-mini" viewBox="0 0 64 28" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 2l1 3.5c3.5 1.8 6.5 5.2 6.5 9.5v11H24.5V15c0-4.3 3-7.7 6.5-9.5L32 2z"/>
              <path d="M18 11l.7 2.2c2.1 1.1 3.8 3.1 3.8 5.8v7H13.5v-7c0-2.7 1.7-4.7 3.8-5.8L18 11z"/>
              <path d="M46 11l.7 2.2c2.1 1.1 3.8 3.1 3.8 5.8v7h-9v-7c0-2.7 1.7-4.7 3.8-5.8L46 11z"/>
              <rect x="8.5" y="13" width="2.8" height="13"/>
              <path d="M9.9 8.5l1.6 4.5H8.3l1.6-4.5z"/>
              <rect x="52.7" y="13" width="2.8" height="13"/>
              <path d="M54.1 8.5l1.6 4.5h-3.2l1.6-4.5z"/>
              <rect x="4" y="25" width="56" height="2.4" rx="1.2"/>
            </svg>
            <span class="alq-divider-line alq-divider-line--right"></span>
          </div>

          <!-- Emerald & Gold Slogan Banner -->
          <div class="alq-banner-row">
            <svg class="alq-diamond" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0L10.4 5.6L16 8L10.4 10.4L8 16L5.6 10.4L0 8L5.6 5.6L8 0Z"/>
            </svg>
            <div class="alq-banner">
              <p class="alq-banner-text">
                &ldquo;Gunakan Internet Untuk <span class="alq-banner-highlight">Hal Positip</span>&rdquo;
              </p>
            </div>
            <svg class="alq-diamond" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0L10.4 5.6L16 8L10.4 10.4L8 16L5.6 10.4L0 8L5.6 5.6L8 0Z"/>
            </svg>
          </div>

          <!-- Subtitle -->
          <div class="alq-subtitle-row">
            <span class="alq-sub-line" aria-hidden="true"></span>
            <p class="alq-subtitle">(Internetan Sambil Beramal)</p>
            <span class="alq-sub-line alq-sub-line--right" aria-hidden="true"></span>
          </div>

          <!-- MikroTik Hotspot Login Form (Original Application Logic Preserved) -->
          <form
            class="alq-form"
            name="login"
            action="$(link-login-only)"
            method="post"
            $(if chap-id) onSubmit="return doLogin()" $(endif)
          >
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="password" />

            <div class="alq-input-wrap">
              <svg class="alq-user-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2.5c-3.33 0-10 1.67-10 5V21h20v-1.5c0-3.33-6.67-5-10-5z"/>
              </svg>
              <input
                id="username-input"
                type="text"
                class="alq-input"
                name="username"
                onblur="password.value=username.value"
                oninput="password.value=username.value"
                placeholder="Username / Password"
                required="required"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="Username atau Password Voucher"
              />
              <button
                type="button"
                id="toggle-visibility"
                class="alq-eye-btn"
                aria-label="Sembunyikan atau tampilkan kode voucher"
                aria-pressed="false"
              >
                <!-- Eye-Off Icon (Default matching mockup) -->
                <svg id="icon-eye-off" class="alq-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
                <!-- Eye-On Icon (Hidden initially) -->
                <svg id="icon-eye-on" class="alq-eye-icon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <button name="submit" type="submit" class="alq-submit-btn">
              <svg class="alq-login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
              <span>Login</span>
            </button>
          </form>

$(if error)
          <div class="alq-error" role="alert">
            $(error)
          </div>
$(endif)

$(if trial == 'yes')
          <div class="alq-trial-wrap">
            <a
              class="alq-trial-link"
              href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)"
            >Akses Gratis (Trial)</a>
          </div>
$(endif)
        </div>
      </section>

      <!-- Bottom Mosque Illustration, Students & Emerald Arch Footer -->
      <footer class="alq-bottom">
        <img
          src="img/bottom-scene.jpg"
          alt="Ilustrasi santri belajar dengan laptop dan tablet di depan masjid Al-Qomar"
          class="alq-scene-img"
        />
        <div class="alq-footer-overlay">
          <div class="alq-footer-brand">Al-Qomar Hotspot</div>
          <div class="alq-footer-tag">
            <span class="alq-footer-line" aria-hidden="true"></span>
            <span class="alq-footer-sub">Terhubung dengan Kebaikan</span>
            <span class="alq-footer-line alq-footer-line--right" aria-hidden="true"></span>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script type="text/javascript">
    document.login.username.focus();
    (function () {
      var input = document.getElementById('username-input');
      var btn = document.getElementById('toggle-visibility');
      var eyeOff = document.getElementById('icon-eye-off');
      var eyeOn = document.getElementById('icon-eye-on');
      if (input && btn) {
        btn.addEventListener('click', function () {
          var isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';
          btn.setAttribute('aria-pressed', String(!isHidden));
          if (eyeOff && eyeOn) {
            eyeOff.style.display = isHidden ? 'block' : 'none';
            eyeOn.style.display = isHidden ? 'none' : 'block';
          }
          input.focus();
        });
      }
    })();
  </script>
</body>
</html>
